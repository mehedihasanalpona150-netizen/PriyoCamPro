name: Build Android APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew || true

      - name: Find Gradle and Build
        run: |
          if [ -f "build.gradle" ] || [ -f "build.gradle.kts" ]; then
            echo "Found build file in root directory."
            ./gradlew assembleDebug || gradle assembleDebug
          else
            echo "Searching for build file in subdirectories..."
            SUBDIR=$(find . -maxdepth 2 -name "build.gradle" -o -name "build.gradle.kts" | head -n 1 | xargs dirname)
            if [ -n "$SUBDIR" ]; then
              echo "Found project in $SUBDIR"
              cd "$SUBDIR"
              ./gradlew assembleDebug || gradle assembleDebug
            else
              echo "No build.gradle found in repository!"
              exit 1
            fi
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PriyoCamPro-APK
          path: '**/app/build/outputs/apk/debug/*.apk'
          
